<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ontario Fall Colors - Live Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8f9fa;
    }

    .header {
      background: linear-gradient(to right, #f97316, #dc2626);
      color: white;
      padding: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      position: relative;
      z-index: 10;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header h1 {
      font-size: 1.75rem;
      font-weight: bold;
    }

    .header-info {
      font-size: 0.875rem;
      opacity: 0.9;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .refresh-btn {
      background: rgba(255,255,255,0.2);
      border: 2px solid white;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.875rem;
    }

    .refresh-btn:hover {
      background: rgba(255,255,255,0.3);
    }

    .refresh-btn.loading {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 1rem;
      padding: 1rem;
      height: calc(100vh - 120px);
    }

    #map {
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      background: #f0f0f0;
    }

    .sidebar {
      background: white;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      background: linear-gradient(to right, #f97316, #dc2626);
      color: white;
      padding: 1rem;
      font-weight: 600;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }

    .park-detail {
      display: none;
    }

    .park-detail.active {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .park-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #111827;
      margin-bottom: 0.5rem;
    }

    .park-date {
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 0.5rem;
    }

    .park-distance {
      color: #f97316;
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem;
      background: #f3f4f6;
      border-radius: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .stat-label {
      font-size: 0.875rem;
      color: #555;
      font-weight: 600;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: bold;
      color: #f97316;
    }

    .peak-indicator {
      background: #fee2e2;
      border-left: 4px solid #dc2626;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      font-weight: 600;
      color: #7f1d1d;
      font-size: 0.875rem;
    }

    .peak-indicator.approaching {
      background: #fef3c7;
      border-left-color: #f97316;
      color: #78350f;
    }

    .peak-indicator.peak {
      background: #fecaca;
      border-left-color: #dc2626;
      color: #7f1d1d;
    }

    .park-desc {
      color: #374151;
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    button {
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.875rem;
    }

    .btn-primary {
      background: linear-gradient(to right, #f97316, #dc2626);
      color: white;
      text-decoration: none;
      display: block;
      text-align: center;
    }

    .btn-primary:hover {
      box-shadow: 0 4px 6px rgba(0,0,0,0.15);
    }

    .btn-secondary {
      background: #d1d5db;
      color: #111827;
    }

    .btn-secondary:hover {
      background: #b3b3b3;
    }

    .sidebar-empty {
      text-align: center;
      color: #999;
      padding: 2rem 1rem;
    }

    .sidebar-empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .legend {
      background: white;
      padding: 1rem;
      border-radius: 0.5rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      max-width: 350px;
      margin-left: auto;
      margin-right: 1rem;
    }

    .legend-title {
      font-weight: bold;
      margin-bottom: 0.75rem;
      color: #111827;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .legend-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-circle.peak {
      background: #dc2626;
      border: 3px solid #991b1b;
    }

    .legend-circle.approaching {
      background: #f97316;
      border: 3px solid #ea580c;
    }

    .legend-circle.early {
      background: #84cc16;
    }

    .last-update {
      font-size: 0.75rem;
      color: #999;
      margin-top: 1rem;
      text-align: center;
    }

    .loading-spinner {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        height: auto;
      }

      #map {
        height: 400px;
      }

      .sidebar {
        height: 300px;
      }

      .legend {
        max-width: none;
        margin-left: 1rem;
        margin-right: 1rem;
      }

      .header-content {
        flex-direction: column;
        align-items: flex-start;
      }

      .header h1 {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <div>
        <h1>🍂 Ontario Fall Colors - Live Map</h1>
        <div class="header-info">
          <span>Real-time peak viewing data</span>
          <span>Updated: <strong id="updateFreq">every hour</strong></span>
        </div>
      </div>
      <button class="refresh-btn" onclick="refreshData()">🔄 Refresh Now</button>
    </div>
  </div>

  <div class="legend">
    <div class="legend-title">Peak Viewing Status</div>
    <div class="legend-item">
      <div class="legend-circle peak"></div>
      <span>Peak Viewing</span>
    </div>
    <div class="legend-item">
      <div class="legend-circle approaching"></div>
      <span>Approaching Peak</span>
    </div>
    <div class="legend-item">
      <div class="legend-circle early"></div>
      <span>Early Season</span>
    </div>
    <div class="last-update">Last updated: <span id="lastUpdate">loading...</span></div>
  </div>

  <div class="container">
    <div id="map"></div>
    <div class="sidebar">
      <div class="sidebar-header">Park Details</div>
      <div class="sidebar-content">
        <div class="sidebar-empty">
          <div class="sidebar-empty-icon">📍</div>
          <p>Click a park marker to see details</p>
        </div>
        <div id="parkDetail" class="park-detail"></div>
      </div>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([51.2538, -85.3232], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 10
    }).addTo(map);

    const markers = {};
    let parkData = {};
    let selectedPark = null;

    // Use this URL - it points to parks_data.json in your GitHub repo
    const DATA_SOURCE = 'https://raw.githubusercontent.com/YOUR_USERNAME/fall-colors-data/main/parks_data.json';

    function getMarkerColor(change, leafFall) {
      if (change >= 10 && leafFall >= 10) return '#dc2626';
      if (change >= 5 || leafFall >= 5) return '#f97316';
      return '#84cc16';
    }

    function getPeakStatus(change, leafFall) {
      if (change >= 10 && leafFall >= 10) return { label: '🔴 PEAK VIEWING', class: 'peak' };
      if (change >= 5 || leafFall >= 5) return { label: '🟠 Approaching Peak', class: 'approaching' };
      return { label: '🟢 Early Season', class: 'early' };
    }

    async function loadData() {
      try {
        const response = await fetch(DATA_SOURCE);
        const data = await response.json();
        parkData = data.parks;
        initializeMap();
        updateLastUpdate(data.lastUpdated);
      } catch (error) {
        console.error('Error loading park data:', error);
        document.querySelector('.sidebar-empty').innerHTML = `
          <div class="sidebar-empty-icon">⚠️</div>
          <p>Error loading data. Make sure parks_data.json exists in your repo.</p>
          <p style="font-size: 0.75rem; margin-top: 1rem; color: #999;">Update DATA_SOURCE URL with your GitHub username.</p>
        `;
      }
    }

    function initializeMap() {
      Object.values(markers).forEach(marker => marker.remove());
      markers = {};

      Object.entries(parkData).forEach(([name, data]) => {
        const color = getMarkerColor(data.colorChange, data.leafFall);
        const peakStatus = getPeakStatus(data.colorChange, data.leafFall);

        const marker = L.circleMarker([data.lat, data.lng], {
          radius: 12,
          fillColor: color,
          color: color === '#dc2626' ? '#991b1b' : color === '#f97316' ? '#ea580c' : '#65a30d',
          weight: color === '#dc2626' ? 3 : 2,
          opacity: 1,
          fillOpacity: 0.8
        });

        marker.bindPopup(`
          <div style="font-size: 0.875rem; min-width: 150px;">
            <strong>${name}</strong><br>
            Color Change: ${data.colorChange}%<br>
            Leaf Fall: ${data.leafFall}%<br>
            ${peakStatus.label}
          </div>
        `);

        marker.on('click', () => showParkDetail(name, data, peakStatus));
        markers[name] = marker;
        marker.addTo(map);
      });
    }

    function showParkDetail(name, data, peakStatus) {
      selectedPark = name;
      
      const html = `
        <div class="park-name">${name}</div>
        <div class="park-distance">📍 ${data.distance} min from Brampton</div>
        
        <div class="peak-indicator ${peakStatus.class}">
          ${peakStatus.label}
        </div>

        <div class="stat-row">
          <span class="stat-label">🎨 Color Change</span>
          <span class="stat-value">${data.colorChange}%</span>
        </div>

        <div class="stat-row">
          <span class="stat-label">🍃 Leaf Fall</span>
          <span class="stat-value">${data.leafFall}%</span>
        </div>

        <p class="park-desc">${data.desc || 'Beautiful fall foliage viewing.'}</p>

        <div class="action-buttons">
          <a href="https://www.ontarioparks.ca" target="_blank" class="btn-primary">Book Now</a>
          <button class="btn-secondary" onclick="shareSnapshot('${name}')">📤 Share</button>
        </div>
      `;

      document.getElementById('parkDetail').innerHTML = html;
      document.getElementById('parkDetail').classList.add('active');
      document.querySelector('.sidebar-empty').style.display = 'none';
    }

    function shareSnapshot(parkName) {
      const data = parkData[parkName];
      const date = new Date().toLocaleString();
      const text = `🍂 ${parkName} - Fall Color Report\n\nColor Change: ${data.colorChange}%\nLeaf Fall: ${data.leafFall}%\nDistance: ${data.distance} min from Brampton\n\nCaptured: ${date}\n\nCheck live map → https://fall-colors-data.vercel.app`;
      
      if (navigator.share) {
        navigator.share({ text, title: `${parkName} Fall Colors` });
      } else {
        navigator.clipboard.writeText(text);
        alert('Snapshot copied to clipboard!');
      }
    }

    function updateLastUpdate(timestamp) {
      const date = new Date(timestamp);
      document.getElementById('lastUpdate').textContent = date.toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: true
      });
    }

    async function refreshData() {
      const btn = document.querySelector('.refresh-btn');
      btn.classList.add('loading');
      btn.innerHTML = '<span class="loading-spinner">⏳</span> Updating...';

      try {
        await loadData();
        if (selectedPark && parkData[selectedPark]) {
          const data = parkData[selectedPark];
          const peakStatus = getPeakStatus(data.colorChange, data.leafFall);
          showParkDetail(selectedPark, data, peakStatus);
        }
      } catch (error) {
        console.error('Error refreshing data:', error);
      } finally {
        btn.classList.remove('loading');
        btn.textContent = '🔄 Refresh Now';
      }
    }

    // Auto-refresh every 5 minutes
    setInterval(loadData, 5 * 60 * 1000);

    // Load data on page load
    loadData();
  </script>
</body>
</html>
